# Paste this into TrueNAS SCALE: Apps -> Discover Apps -> Custom App ->
# "Install via YAML". It also works with plain `docker compose up -d`.
services:
  wikirace:
    container_name: wikirace
    # Built by GitHub Actions on every push and published here, so the NAS
    # only has to pull it. Change the owner if you forked this.
    image: ghcr.io/machmar/wikirace:latest
    pull_policy: always
    # To build it on the NAS instead, comment the two lines above out and
    # uncomment this:
    # build: .

    restart: unless-stopped

    ports:
      # host:container - change the left side if 8420 is taken on your NAS.
      - "8420:8420"

    environment:
      # A code to get in. Delete this line if something in front already does
      # the asking - a reverse proxy with its own login, or a private network.
      # Without it the game is open to anyone who can reach the port.
      WIKIRACE_CODE: "change-me-before-you-expose-this"

      # Only relevant if other copies of the game run on the same network as
      # the NAS: those ignore each other unless the room names match. It does
      # NOT split the people connecting to this server - everyone who opens it
      # shares one game. Leave it be unless you know you need it.
      WIKIRACE_ROOM: "default"

      # The rest are already set in the image and are here to be seen rather
      # than changed: host mode on, no browser to open, no LAN discovery
      # (there are no other copies on a NAS to find), data on the volume.
      WIKIRACE_HOST: "1"
      WIKIRACE_NO_BROWSER: "1"
      WIKIRACE_NO_DISCOVERY: "1"
      WIKIRACE_DATA: "/data"

    volumes:
      # The scoreboard. Point the left side at a dataset you keep, e.g.
      #   /mnt/tank/apps/wikirace:/data
      - wikirace-data:/data

    # Match this to whoever owns the dataset above, or the standings can't be
    # written. TrueNAS shows the uid/gid in the dataset's permissions screen.
    user: "1000:1000"

volumes:
  wikirace-data:
